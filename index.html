<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ລິ້ງນີ້ໄດ້ຍ້າຍແລ້ວ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Lao:wght@400;500;600;700&family=Noto+Sans+Lao:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:      #fefdfb;
    --paper-2:    #fff9f3;
    --ink:        #241d16;
    --ink-soft:   #6b6058;
    --orange:     #ff6a2c;
    --orange-2:   #ff8a4c;
    --orange-pale:#ffe2cd;
    --peach:      #ffcfa8;
    --line:       rgba(36,29,22,0.09);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    font-family:'Noto Sans Lao','Inter',sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- dimensional white/orange field ---------- */
  .field{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 82% 8%,  rgba(255,138,76,0.16), transparent 60%),
      radial-gradient(ellipse 55% 45% at 8% 92%,   rgba(255,106,44,0.10), transparent 65%),
      linear-gradient(180deg, #fffefb 0%, #fdf9f4 100%);
  }

  .field::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(36,29,22,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(36,29,22,0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 65% 55% at 50% 40%, black, transparent 78%);
  }

  .blob{
    position:absolute;
    border-radius:50%;
    filter: blur(60px);
    opacity:.55;
  }
  .blob.b1{ width:420px; height:420px; top:-140px; right:-120px; background: radial-gradient(circle, var(--peach), transparent 70%); }
  .blob.b2{ width:340px; height:340px; bottom:-140px; left:-100px; background: radial-gradient(circle, var(--orange-pale), transparent 70%); }

  /* ---------- layered card stack: the "signature" ---------- */
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 560px;
  }

  .deck{
    position:relative;
    padding-top: 6px;
  }

  .sheet{
    position:absolute;
    inset:0;
    border-radius: 22px;
    background: linear-gradient(155deg, var(--orange) 0%, var(--orange-2) 100%);
    opacity:0;
    animation: slideIn .9s cubic-bezier(.22,.9,.32,1) forwards;
  }
  .sheet.s2{ background: var(--orange-pale); }

  .sheet.s1{
    animation:
      slideS1 .9s cubic-bezier(.22,.9,.32,1) .05s forwards,
      swayS1 5.5s ease-in-out 1s infinite;
  }
  .sheet.s2{
    animation:
      slideS2 .9s cubic-bezier(.22,.9,.32,1) .15s forwards,
      swayS2 6.5s ease-in-out 1.1s infinite;
  }
  @keyframes slideS1{
    from{ opacity:0; transform: rotate(0deg) translate(0,24px) scale(.96); }
    to{ opacity:1; transform: rotate(-6deg) translate(-8px,10px) scale(1); }
  }
  @keyframes slideS2{
    from{ opacity:0; transform: rotate(0deg) translate(0,24px) scale(.96); }
    to{ opacity:1; transform: rotate(4deg) translate(10px,14px) scale(1); }
  }
  /* gentle left-right sway to sell the "loose deck of cards" feel */
  @keyframes swayS1{
    0%, 100%{ transform: rotate(-6deg) translate(-8px, 10px); }
    50%{ transform: rotate(-8deg) translate(-20px, 8px); }
  }
  @keyframes swayS2{
    0%, 100%{ transform: rotate(4deg) translate(10px, 14px); }
    50%{ transform: rotate(6deg) translate(22px, 12px); }
  }

  .card{
    position:relative;
    z-index:2;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 56px 44px 44px;
    text-align:center;
    box-shadow:
      0 1px 1px rgba(36,29,22,0.03),
      0 12px 32px rgba(36,29,22,0.07),
      0 30px 70px rgba(255,106,44,0.10);
    opacity:0;
    transform: translateY(20px);
    animation: rise .9s cubic-bezier(.22,.9,.32,1) .25s forwards;
  }

  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .mark{
    width:52px; height:52px;
    margin: 0 auto 26px;
  }
  .mark svg{ width:100%; height:100%; display:block; }
  .mark .ring{
    fill:none;
    stroke: var(--orange-pale);
    stroke-width: 2;
  }
  .mark .arc{
    fill:none;
    stroke: var(--orange);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 90 200;
    animation: spin 2.6s ease-in-out infinite;
    transform-origin: 50% 50%;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .mark .pin{ fill: var(--orange); }

  .eyebrow{
    font-family:'Noto Sans Lao', sans-serif;
    font-weight:500;
    letter-spacing: 0.22em;
    font-size: 12px;
    color: var(--orange);
    margin-bottom: 18px;
  }

  h1{
    font-family:'Noto Serif Lao', serif;
    font-weight:600;
    font-size: clamp(24px, 4.6vw, 32px);
    line-height:1.55;
    color: var(--ink);
    margin-bottom: 16px;
  }

  .divider{
    width:56px; height:3px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--orange), var(--orange-2));
    margin: 0 auto 24px;
  }

  p.desc{
    font-family:'Noto Sans Lao', sans-serif;
    font-weight:400;
    font-size: 15.5px;
    line-height: 1.85;
    color: var(--ink-soft);
    max-width: 460px;
    margin: 0 auto 14px;
  }

  p.apology{
    font-family:'Noto Sans Lao', sans-serif;
    font-weight:400;
    font-size: 13.5px;
    line-height:1.8;
    color: rgba(107,96,88,0.75);
    max-width: 400px;
    margin: 0 auto 36px;
    font-style: italic;
  }

  .cta{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding: 16px 38px;
    border-radius: 999px;
    color: #fff;
    text-decoration:none;
    font-family:'Noto Sans Lao', sans-serif;
    font-weight:500;
    font-size: 15px;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, var(--orange) 0%, var(--orange-2) 100%);
    box-shadow: 0 10px 26px rgba(255,106,44,0.32);
    overflow: hidden;
    transition: transform .35s ease, box-shadow .35s ease;
    animation: ctaNudge 3.2s ease-in-out infinite;
  }

  /* idle nudge to draw the eye — pauses the moment someone engages */
  @keyframes ctaNudge{
    0%, 100%{ transform: translateY(0) scale(1); }
    58%{ transform: translateY(0) scale(1); }
    64%{ transform: translateY(-3px) scale(1.015); }
    69%{ transform: translateY(0) scale(1); }
    73%{ transform: translateY(-2px) scale(1.01); }
    77%{ transform: translateY(0) scale(1); }
  }

  .cta:hover{
    animation-play-state: paused;
    transform: translateY(-2px) scale(1.015);
    box-shadow: 0 16px 36px rgba(255,106,44,0.42);
  }
  .cta:active{ transform: translateY(0) scale(1); }
  .cta:focus-visible{
    outline: 2px solid var(--orange);
    outline-offset: 4px;
  }

  .cta svg{
    width:16px; height:16px;
    transition: transform .4s ease;
  }
  .cta:hover svg{ transform: translateX(4px); }

  .footnote{
    margin-top: 30px;
    font-family:'Inter', sans-serif;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    color: rgba(36,29,22,0.38);
  }
  .footnote a{
    color: var(--orange);
    text-decoration: none;
    border-bottom: 1px solid rgba(255,106,44,0.3);
  }

  @media (prefers-reduced-motion: reduce){
    .card, .sheet, .mark .arc, .cta{ animation: none !important; }
    .card{ opacity:1; transform:none; }
    .sheet{ opacity:1; }
    .sheet.s1{ transform: rotate(-6deg) translate(-8px,10px); }
    .sheet.s2{ transform: rotate(4deg) translate(10px,14px); }
  }

  @media (max-width: 480px){
    .card{ padding: 44px 26px 36px; }
    .cta{ padding: 14px 30px; font-size: 14px; }
    p.desc{ font-size: 14.5px; }
  }
</style>
</head>
<body>

  <div class="field" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
  </div>

  <div class="stage">
    <div class="deck">
      <div class="sheet s1"></div>
      <div class="sheet s2"></div>

      <main class="card">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 52 52">
            <circle class="ring" cx="26" cy="26" r="22"></circle>
            <circle class="arc" cx="26" cy="26" r="22"></circle>
            <path class="pin" d="M26 15c-4.6 0-8.3 3.7-8.3 8.3 0 6.3 8.3 13.7 8.3 13.7s8.3-7.4 8.3-13.7c0-4.6-3.7-8.3-8.3-8.3zm0 11.3a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
          </svg>
        </div>

        <p class="eyebrow">ແຈ້ງການປ່ຽນທີ່ຢູ່ເວັບໄຊທ໌</p>

        <h1>ລິ້ງນີ້ບໍ່ສາມາດໃຊ້ງານໄດ້ອີກຕໍ່ໄປ</h1>

        <div class="divider"></div>

        <p class="desc">
          ເວັບໄຊທ໌ໄດ້ຍ້າຍທີ່ຢູ່ໃໝ່ແລ້ວ<br>
          ກົດປຸ່ມລຸ່ມນີ້ເພື່ອໄປຕໍ່
        </p>

        <p class="apology">ຂໍອະໄພໃນຄວາມບໍ່ສະດວກ</p>

        <a class="cta" href="https://www.denthai.shop" rel="noopener">
          ໄປຫາເວັບໄຊທ໌ໃໝ່
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>

        <p class="footnote"><a href="https://www.denthai.shop" rel="noopener">www.denthai.shop</a></p>
      </main>
    </div>
  </div>

</body>
</html>
