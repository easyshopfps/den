<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ຕິດຕໍ່ · ພໍ່ຄ້າໜ້າຫວານ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Lao', sans-serif;
      background: #0D1B35; color: #fff;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #E84F00, #FF6B1A 60%, #FF9148);
      padding: 0 18px; height: 58px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo img { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; }
    .logo-main { font-weight: 900; font-size: .95rem; color: #fff; }
    .logo-sub  { font-size: .62rem; color: rgba(255,255,255,0.8); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      border-radius: 20px; padding: 7px 14px;
      font-family: 'Noto Sans Lao', sans-serif;
      font-size: .8rem; font-weight: 700; cursor: pointer;
      text-decoration: none;
    }

    /* BODY */
    .page { max-width: 480px; margin: 0 auto; padding: 28px 18px 60px; }

    .page-title {
      font-size: 1.2rem; font-weight: 900;
      color: #FF9148; text-align: center; margin-bottom: 24px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* CONTACT CARD */
    .contact-card {
      display: flex; align-items: center; gap: 16px;
      border-radius: 16px; padding: 16px 18px;
      text-decoration: none; margin-bottom: 12px;
      transition: transform .18s, opacity .18s;
    }
    .contact-card:active { transform: scale(.97); opacity: .85; }
    .contact-card .icon-wrap {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .contact-card .info { flex: 1; }
    .contact-card .info .title { font-weight: 700; font-size: .92rem; color: #fff; margin-bottom: 3px; }
    .contact-card .info .sub   { font-size: .75rem; color: rgba(255,255,255,0.55); }
    .contact-card .arrow {
      color: rgba(255,255,255,0.3);
    }

    /* Facebook */
    .card-fb { background: #1877F2; }
    .card-fb .icon-wrap { background: rgba(255,255,255,0.2); }

    /* TikTok */
    .card-tt { background: #111; border: 1px solid rgba(255,255,255,0.08); }
    .card-tt .icon-wrap { background: rgba(255,255,255,0.08); }

    /* WhatsApp section */
    .wa-section-title {
      font-size: .72rem; font-weight: 700; color: rgba(255,255,255,0.4);
      text-transform: uppercase; letter-spacing: .08em;
      margin: 20px 0 10px; padding: 0 4px;
    }
    .card-wa { background: #162444; border: 1px solid rgba(255,255,255,0.07); }
    .card-wa .icon-wrap { background: rgba(37,211,102,0.15); }
    .card-wa .info .title { color: #25D366; }
    .card-wa .info .sub   { color: rgba(255,255,255,0.4); }

    /* divider */
    .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 20px 0; }
  </style>
</head>
